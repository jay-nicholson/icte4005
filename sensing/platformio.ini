[platformio]
default_envs = uno

[env:uno]
platform = platformio/atmelavr@5.0.0
board = uno
framework = arduino
monitor_speed = 9600
build_flags = -I../shared
build_src_filter = +<*> -<calibrate.cpp>
test_ignore = *

; Bench helper: measures the Hall and LDR readings so thresholds come from data, not guesses.
[env:calibrate]
extends = env:uno
build_src_filter = +<*> -<main.cpp>

; Host tests, as in the master. The end-to-end test drives the unchanged master and conveyor logic.
[env:native]
platform = native
build_flags = -I../shared -std=c++11
lib_extra_dirs = ../conveyor/lib, ../master/lib
test_framework = unity
